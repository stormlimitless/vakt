{{template "admin_head" .}}
<div class="max-w-lg">
  <h1 class="text-2xl font-semibold">Authenticator for {{.U.Username}}</h1>
  <p class="mt-2 text-sm text-stone-600">Scan the code with an authenticator app, then enter the six-digit code it shows to finish.</p>
  <img src="{{.QR}}" alt="QR code" width="200" height="200" class="mt-6 rounded border border-stone-200 bg-white p-2">
  <p class="mt-3 text-xs text-stone-500">Or enter manually: <code class="select-all">{{.Secret}}</code></p>
  <form method="post" action="/admin/users/{{.U.ID}}/totp/confirm" class="mt-6 space-y-4">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label class="block"><span class="text-sm font-medium">Code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" required class="{{template "input"}}"></label>
    <div class="flex gap-3"><button class="{{template "btn"}}">Confirm</button><a href="/admin/users/{{.U.ID}}" class="{{template "btn_secondary"}}">Cancel</a></div>
  </form>
</div>
{{template "admin_foot" .}}
