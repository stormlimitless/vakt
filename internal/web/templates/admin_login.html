{{template "admin_head" .}}
<div class="mx-auto max-w-sm">
  <p class="text-xs uppercase tracking-widest text-stone-500">Vakt</p>
  <h1 class="mt-2 text-2xl font-semibold">Admin sign in</h1>
  <form method="post" action="/admin/login" class="mt-8 space-y-4">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label class="block"><span class="text-sm font-medium">Username</span><input name="username" autocomplete="username" class="{{template "input"}}"></label>
    <label class="block"><span class="text-sm font-medium">Password</span><input name="password" type="password" autocomplete="current-password" class="{{template "input"}}"></label>
    <label class="block"><span class="text-sm font-medium">Authenticator code <span class="text-stone-500">(if enabled)</span></span><input name="totp" inputmode="numeric" autocomplete="one-time-code" class="{{template "input"}}"></label>
    <button class="w-full {{template "btn"}}">Sign in</button>
  </form>
</div>
{{template "admin_foot" .}}
